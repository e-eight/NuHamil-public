# ---------------------------------------------------------------------------
# NuHamil-faster benchmark case definitions
#
# Consumed by bench/gen_cases.py (builds inputs) and bench/collect.py (parses
# results).  A case stores the *arguments* to the upstream parameter builders
# rather than a raw namelist, so all derived quantities (jmax3, LECs, output
# file names, ...) stay in one place:
#
#   kind: deuteron  -> exe/few-body/deuteron.py    set_input()
#   kind: namelist2 -> exe/NuHamil_2BME.py         set_input()
#   kind: namelist3 -> exe/NuHamil_3BME.py         set_input()
#
# 3N cases are instantiated once per entry in their ramp_sweep, producing run
# dirs named <case-id>__<ramp-name>.  The ramp is the only control on the
# lab-frame 3N channel truncation (ThreeBodyManager.F90:107) and therefore on
# the size of the Jacobi space (cfp/), which dominates both memory and setup
# time.  Non-3N cases keep their plain <case-id>.
#
# tier:  smoke | small | medium | large | production
#        'production' cases are DEFINED but EXCLUDED from the default sweep
#        (they are the real 2-day / ~200 GB targets).
#
# Nothing in this file writes to $HOME.  All outputs go under scratch_root.
# ---------------------------------------------------------------------------
version: 1

scratch_root: /scratch/soham/NuHamil-faster

defaults:
  nn: N3LO_EM500            # NNF  : two-body interaction
  tnf: N3LOEMlnl            # TNF  : three-body interaction (3N cases only)
  hw: 30                    # starting hw [MeV]
  hw_target: 16             # target hw after conversion (3N cases only)
  emax: 8
  e2max: 16
  e3max: 6

# ---------------------------------------------------------------------------
# Jacobi-space ramps.  GetRampNmax() in src/ThreeBody/ThreeBodyJacobiSpaceIso.F90
# matches on 2J+1, so these strings expand to:
#
#   ramplarge  "ramp40-5-36-7-32-9-28-11-24"
#              2J+1 <= 5 -> Nmax 40, <= 7 -> 36, <= 9 -> 32, <= 11 -> 28, else 24
#              (the upstream exe/NuHamil_3BME.py default)
#   rampsmall  "ramp20-5-18-7-16"
#              2J+1 <= 5 -> Nmax 20, <= 7 -> 18, else 16
#              (the reduced ramp used for the 2026-10-02 ramp20/ sweep)
#
# gen_cases.py records the exact per-channel Nmax map in each manifest
# (derived.nmax_per_channel) so it can be cross-checked against the "Nmax ="
# values the code prints for every channel.
# ---------------------------------------------------------------------------
ramps:
  ramplarge: "ramp40-5-36-7-32-9-28-11-24"
  rampsmall: "ramp20-5-18-7-16"

cases:

  - id: deuteron
    tier: smoke
    kind: deuteron
    description: >-
      Deuteron ground state, N3LO_EM500 bare, hw=30.  Fast correctness smoke
      test for any new build.
    hw: 30
    reference:
      energy_MeV: -2.22434870
      tolerance_MeV: 1.0e-5
      source: "~/NuHamil-public/deuteron_test.log (frozen in golden/logs/)"

  - id: 2bme_lab_emax14
    tier: medium
    kind: namelist2
    description: >-
      Lab-frame HO two-body matrix elements, emax=14, e2max=28, hw=16,
      SRG(2.0).  README quotes ~15 min on 16 OpenMP threads.
    hw: 16
    emax: 14
    e2max: 28
    reference: {}

  - id: 3bme_e3max6
    tier: small
    kind: namelist3
    ramp_sweep: [ramplarge, rampsmall]
    description: >-
      3N lab-frame ME, emax=8 e2max=16 e3max=6, hw=30->16, N3LO_EM500 +
      N3LOEMlnl.  32 (J,P,T) channels; single precision.
    emax: 8
    e2max: 16
    e3max: 6
    reference:
      # The .me3j product is ASCII text and is NOT bit-reproducible across
      # configurations -- threading and rank changes reorder summations, so the
      # same binary at 32 ranks x 1 thread and 8 ranks x 4 threads differs in ~3%
      # of bytes.  Correctness is therefore a TOLERANCE check, not a hash, which
      # is what bench/accept.py implements.  Pass criterion, elementwise:
      #     |candidate - golden| <= atol + rtol * |golden|
      # atol carries the weight: the data contains many near-zero elements whose
      # relative differences are meaningless.
      #
      # Defaults are set from measurement, not guesswork.
      # Worst deviation measured so far is 5.2e-06 (the single-worker configs
      # 2x16/1x32), so atol=1e-4 leaves a ~19x margin: a legitimate rebuild or
      # reconfiguration passes while a real regression fails.  See the docstring
      # of bench/accept.py for the full measured table.
      #
      # NOTE: only the rampsmall ramp has a harvested golden product (e3max 6-10
      # in golden/me3j/rampsmall/).  The ramplarge products were never captured,
      # so ramplarge runs currently have no product acceptance check.
      product:
        golden: golden/me3j/rampsmall/ThBME_srg2.0_ramp20-5-18-7-16_N3LO_EM500_c1_-0.81_c3_-3.2_c4_5.4_cD_0.7_cE_-0.06_LNL2_650_500_IS_hw16from30_ms8_16_6.me3j.gz
        ramps: [rampsmall]
        atol: 1.0e-4
        rtol: 1.0e-4

  - id: 3bme_e3max8
    tier: medium
    kind: namelist3
    ramp_sweep: [ramplarge, rampsmall]
    description: >-
      3N lab-frame ME, emax=8 e2max=16 e3max=8, hw=30->16.  40 channels.
    emax: 8
    e2max: 16
    e3max: 8
    reference: {}

  - id: 3bme_e3max10
    tier: large
    kind: namelist3
    ramp_sweep: [ramplarge, rampsmall]
    description: >-
      3N lab-frame ME, emax=8 e2max=16 e3max=10, hw=30->16.  48 channels.
    emax: 8
    e2max: 16
    e3max: 10
    reference: {}

  - id: 3bme_e3max16_emax14
    tier: production
    kind: namelist3
    ramp_sweep: [ramplarge, rampsmall]
    description: >-
      Production-size 3N lab-frame ME, emax=14 e2max=28 e3max=16, hw=30->16.
      72 channels.  README quotes ~2 days / ~200 GB; this is the real
      performance target for the project.
    emax: 14
    e2max: 28
    e3max: 16
    reference: {}
